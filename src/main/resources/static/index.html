<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알바관리 - 사장님 가입</title>
    <!-- 부트스트랩 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- 💡 공통 메뉴바(헤더)가 동적으로 꽂힐 빈 박스 -->
<div id="header-placeholder"></div>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4">사장님 회원가입</h2>
                    
                    <form id="signupForm">
                        <div class="mb-3">
                            <label for="email" class="form-label">이메일</label>
                            <input type="email" class="form-control" id="email" placeholder="boss@test.com" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">비밀번호</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <div class="mb-3">
                            <label for="name" class="form-label">이름</label>
                            <input type="text" class="form-control" id="name" placeholder="홍길동" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 mt-3">가입하기</button>
                    </form>
                    
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 💡 화면 아래쪽에서 외부 자바스크립트 파일 2개 연결 -->
<script src="/js/layout.js"></script>
<script src="/js/signup.js"></script>

</body>
</html>
